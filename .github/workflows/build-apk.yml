name: Build debug APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: StarkFamily-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Easy phone download: Releases page -> "debug-latest" -> app-debug.apk
      - name: Publish to Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Stark Family debug (latest)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
